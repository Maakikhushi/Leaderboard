<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Marathon 2026 | Live Leaderboard</title>

<style>

:root {
    --uf-blue: #1d9ad6;
    --uf-blue-dark: #0878b5;
    --uf-green: #90c03e;
    --uf-green-dark: #609c20;
    --dark: #071522;
    --dark-2: #0d2233;
    --white: #ffffff;
    --light: #f3f8fb;
    --text: #17232d;
    --muted: #71808c;
    --border: #dce7ed;
    --gold: #f5b82e;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 15% 0%, rgba(29,154,214,.18), transparent 30%),
        radial-gradient(circle at 85% 0%, rgba(144,192,62,.16), transparent 30%),
        #f3f7fa;
    color: var(--text);
}

/* =========================================
   HEADER
========================================= */

.header {
    background:
        linear-gradient(135deg, #061521 0%, #0b2638 55%, #073e58 100%);
    color: white;
    padding: 28px 20px 42px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(29,154,214,.12);
    top: -300px;
    left: -150px;
}

.header::after {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(144,192,62,.10);
    right: -150px;
    top: -250px;
}

.logo-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
}

.logo {
    width: min(420px, 78vw);
    max-height: 125px;
    object-fit: contain;
}

.campaign-date {
    position: relative;
    z-index: 2;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #b9e8ff;
    text-transform: uppercase;
}

.live-pill {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 15px;
    padding: 7px 15px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.08);
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
}

.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #63e43d;
    box-shadow: 0 0 10px #63e43d;
}

/* =========================================
   MAIN
========================================= */

.container {
    width: min(1200px, calc(100% - 28px));
    margin: -22px auto 50px;
    position: relative;
    z-index: 5;
}

/* =========================================
   SUMMARY
========================================= */

.summary {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 12px 35px rgba(8,40,58,.10);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.summary-card {
    padding: 16px;
    border-radius: 13px;
    background: var(--light);
    border: 1px solid var(--border);
}

.summary-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
}

.summary-value {
    font-size: 24px;
    font-weight: 900;
    margin-top: 5px;
    color: var(--dark);
}

.summary-value.green {
    color: var(--uf-green-dark);
}

/* =========================================
   CURRENT LEADER
========================================= */

.leader-card {
    background:
        linear-gradient(135deg, #071a28, #0a354d);
    color: white;
    border-radius: 22px;
    padding: 28px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,40,65,.20);
}

.leader-card::after {
    content: "";
    position: absolute;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    right: -150px;
    top: -170px;
    background: rgba(144,192,62,.12);
}

.leader-inner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 25px;
}

.leader-photo {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid rgba(255,255,255,.85);
    background: #dceaf1;
    flex-shrink: 0;
}

.leader-content {
    flex: 1;
}

.leader-eyebrow {
    color: #8fd7fa;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.leader-name {
    font-size: clamp(25px, 4vw, 42px);
    font-weight: 900;
    margin: 5px 0;
}

.leader-zone {
    color: #a9bbc7;
    font-size: 14px;
}

.leader-collection {
    margin-top: 13px;
    font-size: clamp(30px, 5vw, 50px);
    font-weight: 900;
    color: var(--uf-green);
}

.leader-status {
    display: inline-block;
    margin-top: 8px;
    padding: 7px 12px;
    border-radius: 20px;
    background: rgba(144,192,62,.15);
    color: #b8ee68;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .8px;
}

/* =========================================
   CONTROLS
========================================= */

.controls {
    background: white;
    padding: 18px;
    border-radius: 17px;
    box-shadow: 0 8px 25px rgba(8,40,58,.07);
    margin-bottom: 18px;
}

.search {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 11px;
    outline: none;
    font-size: 15px;
    margin-bottom: 13px;
}

.search:focus {
    border-color: var(--uf-blue);
    box-shadow: 0 0 0 3px rgba(29,154,214,.10);
}

.zone-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.zone-btn {
    border: 1px solid var(--border);
    background: white;
    color: #40515d;
    padding: 9px 13px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
}

.zone-btn:hover {
    border-color: var(--uf-blue);
    color: var(--uf-blue-dark);
}

.zone-btn.active {
    background: var(--uf-blue);
    color: white;
    border-color: var(--uf-blue);
}

/* =========================================
   LEADERBOARD
========================================= */

.board {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(8,40,58,.08);
}

.board-header {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.board-title {
    font-size: 22px;
    font-weight: 900;
    color: var(--dark);
}

.board-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
}

.refresh-text {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
}

/* =========================================
   TABLE
========================================= */

.table-head,
.player-row {
    display: grid;
    grid-template-columns: 70px 1fr 130px 180px 160px;
    align-items: center;
    gap: 15px;
}

.table-head {
    padding: 11px 20px;
    background: #eef6fa;
    color: #62737e;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .8px;
}

.player-row {
    padding: 13px 20px;
    border-bottom: 1px solid #edf2f5;
    min-height: 82px;
}

.player-row:hover {
    background: #f8fbfd;
}

.rank {
    font-size: 20px;
    font-weight: 900;
    color: #60727e;
    text-align: center;
}

.rank.top1 {
    color: #d69b10;
}

.rank.top2 {
    color: #6b7c86;
}

.rank.top3 {
    color: #a66c3d;
}

.player {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.player-photo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    background: linear-gradient(135deg, #d8edf8, #e8f4d3);
    flex-shrink: 0;
    border: 2px solid #e2edf2;
}

.initial-avatar {
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    color: white;
    background: linear-gradient(135deg, var(--uf-blue), var(--uf-green));
}

.player-info {
    min-width: 0;
}

.player-name {
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-zone {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
}

.collection {
    font-size: 18px;
    font-weight: 900;
    color: var(--dark);
}

.eligibility {
    font-size: 11px;
    font-weight: 800;
}

.eligible {
    color: var(--uf-green-dark);
}

.not-eligible {
    color: #a36d3d;
}

.reward-badge {
    display: inline-block;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.reward-top5 {
    background: #e7f6d5;
    color: #4e8a19;
}

.reward-top15 {
    background: #edf6fc;
    color: #1675a8;
}

.reward-outside {
    background: #f1f3f5;
    color: #7a858c;
}

.reward-not {
    background: #f7f0ea;
    color: #96623a;
}

/* =========================================
   LOADING / ERROR
========================================= */

.message {
    padding: 50px 20px;
    text-align: center;
    color: var(--muted);
}

.spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #dce9ef;
    border-top-color: var(--uf-blue);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   FOOTER
========================================= */

.footer {
    text-align: center;
    padding: 25px 10px 35px;
    color: #81909a;
    font-size: 11px;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    .summary {
        grid-template-columns: 1fr;
    }

    .leader-inner {
        flex-direction: column;
        text-align: center;
    }

    .leader-photo {
        width: 105px;
        height: 105px;
    }

    .table-head {
        display: none;
    }

    .player-row {
        grid-template-columns: 42px 1fr auto;
        gap: 10px;
        padding: 14px 13px;
    }

    .player-row > .mobile-zone {
        display: block;
    }

    .desktop-zone {
        display: none;
    }

    .row-reward {
        grid-column: 2 / 4;
        margin-top: -4px;
    }

    .collection {
        text-align: right;
        font-size: 16px;
    }

    .rank {
        font-size: 17px;
    }

    .player-photo {
        width: 45px;
        height: 45px;
    }

    .board-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .refresh-text {
        text-align: left;
    }

}

@media (min-width: 801px) {
    .mobile-zone {
        display: none;
    }
}

</style>
</head>

<body>

<header class="header">

    <div class="logo-wrap">
        <img
            class="logo"
            src="https://drive.google.com/thumbnail?id=1placeholder"
            alt="Market Marathon"
            onerror="this.style.display='none'"
        >
    </div>

    <div class="campaign-date">
        13 — 22 AUGUST 2026
    </div>

    <div class="live-pill">
        <span class="live-dot"></span>
        LIVE LEADERBOARD
    </div>

</header>


<main class="container">

    <section class="summary">

        <div class="summary-card">
            <div class="summary-label">
                Participants
            </div>

            <div
                class="summary-value"
                id="participantCount"
            >
                —
            </div>
        </div>


        <div class="summary-card">
            <div class="summary-label">
                ₹2L+ Eligible
            </div>

            <div
                class="summary-value green"
                id="eligibleCount"
            >
                —
            </div>
        </div>


        <div class="summary-card">
            <div class="summary-label">
                Current Highest Collection
            </div>

            <div
                class="summary-value"
                id="highestCollection"
            >
                —
            </div>
        </div>

    </section>


    <section
        class="leader-card"
        id="leaderCard"
    >

        <div class="leader-inner">

            <div
                id="leaderPhotoContainer"
            ></div>

            <div class="leader-content">

                <div class="leader-eyebrow">
                    🏆 CURRENT LEADER
                </div>

                <div
                    class="leader-name"
                    id="leaderName"
                >
                    Loading...
                </div>

                <div
                    class="leader-zone"
                    id="leaderZone"
                >
                </div>

                <div
                    class="leader-collection"
                    id="leaderCollection"
                >
                    —
                </div>

                <div
                    class="leader-status"
                    id="leaderStatus"
                >
                </div>

            </div>

        </div>

    </section>


    <section class="controls">

        <input
            type="text"
            class="search"
            id="search"
            placeholder="Search salesperson..."
        >

        <div
            class="zone-buttons"
            id="zoneButtons"
        >
        </div>

    </section>


    <section class="board">

        <div class="board-header">

            <div>

                <div class="board-title">
                    LIVE LEADERBOARD
                </div>

                <div class="board-subtitle">
                    Highest collection leads the race
                </div>

            </div>

            <div
                class="refresh-text"
                id="refreshText"
            >
                Updating...
            </div>

        </div>


        <div class="table-head">

            <div>
                Rank
            </div>

            <div>
                Salesperson
            </div>

            <div>
                Zone
            </div>

            <div>
                Collection
            </div>

            <div>
                Current Position
            </div>

        </div>


        <div
            id="leaderboard"
        >
            <div class="message">

                <div class="spinner"></div>

                Loading leaderboard...

            </div>
        </div>

    </section>

</main>


<footer class="footer">

    Market Marathon 2026 • Ultrafresh

</footer>


<script>

/* ==================================================
   MARKET MARATHON API
================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwLVwoCtJqv_v7R3FsRAKIoKg8uUAXts-25bXSgq9x7Z2eBGgAzdmsfX39AzIhOe8hi/exec";


let allData = [];

let selectedZone = "ALL";


/* ==================================================
   FORMAT CURRENCY
================================================== */

function formatCurrency(value) {

    return new Intl.NumberFormat(
        "en-IN",
        {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(value) || 0
    );

}


/* ==================================================
   FORMAT LAKHS
================================================== */

function formatLakhs(value) {

    value =
        Number(value) || 0;

    if (value >= 100000) {

        return (
            "₹" +
            (value / 100000)
                .toFixed(
                    value >= 1000000
                        ? 2
                        : 2
                ) +
            " L"
        );

    }

    return formatCurrency(value);

}


/* ==================================================
   INITIALS
================================================== */

function getInitials(name) {

    const words =
        String(name)
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if (!words.length) {
        return "?";
    }

    if (words.length === 1) {

        return words[0]
            .substring(0, 2)
            .toUpperCase();

    }

    return (
        words[0][0] +
        words[words.length - 1][0]
    ).toUpperCase();

}


/* ==================================================
   PHOTO HTML
================================================== */

function getPhotoHTML(
    person,
    large = false
) {

    const sizeClass =
        large
            ? "leader-photo"
            : "player-photo";


    if (
        person.photo &&
        person.photoStatus !== "◻️ No Photo"
    ) {

        return `
            <img
                class="${sizeClass}"
                src="${person.photo}"
                alt="${escapeHTML(person.name)}"
                loading="lazy"
                onerror="this.outerHTML =
                    '<div class=&quot;${sizeClass} initial-avatar&quot;>
                    ${getInitials(person.name)}
                    </div>'"
            >
        `;

    }


    return `
        <div
            class="${sizeClass} initial-avatar"
        >
            ${getInitials(person.name)}
        </div>
    `;

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================================
   REWARD BADGE
================================================== */

function getRewardBadge(person) {

    if (!person.eligible) {

        return `
            <span class="reward-badge reward-not">
                🔒 Not Eligible
            </span>
        `;

    }


    if (
        person.rewardStatus ===
        "CURRENTLY TOP 5"
    ) {

        return `
            <span class="reward-badge reward-top5">
                🏆 Currently Top 5
            </span>
        `;

    }


    if (
        person.rewardStatus ===
        "CURRENTLY TOP 15"
    ) {

        return `
            <span class="reward-badge reward-top15">
                🎯 Currently Top 15
            </span>
        `;

    }


    return `
        <span class="reward-badge reward-outside">
            Eligible • Outside Top 15
        </span>
    `;

}


/* ==================================================
   LOAD DATA
================================================== */

async function loadData() {

    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                data.error ||
                "Invalid API response"
            );

        }


        allData =
            data.sort(
                (
                    a,
                    b
                ) =>
                    Number(b.collection || 0) -
                    Number(a.collection || 0)
            );


        renderSummary();

        renderLeader();

        buildZoneButtons();

        renderLeaderboard();

        document.getElementById(
            "refreshText"
        ).textContent =
            "Updated " +
            new Date()
                .toLocaleTimeString(
                    "en-IN",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "leaderboard"
        ).innerHTML = `

            <div class="message">

                Unable to load leaderboard.

                <br><br>

                <small>
                    Please refresh the page.
                </small>

            </div>

        `;

    }

}


/* ==================================================
   SUMMARY
================================================== */

function renderSummary() {

    const total =
        allData.length;


    const eligible =
        allData.filter(
            person =>
                person.eligible
        ).length;


    const highest =
        allData.length
            ? Number(
                allData[0].collection
              ) || 0
            : 0;


    document.getElementById(
        "participantCount"
    ).textContent =
        total;


    document.getElementById(
        "eligibleCount"
    ).textContent =
        eligible;


    document.getElementById(
        "highestCollection"
    ).textContent =
        formatLakhs(
            highest
        );

}


/* ==================================================
   CURRENT LEADER
================================================== */

function renderLeader() {

    const leader =
        allData[0];


    if (!leader) {

        return;

    }


    document.getElementById(
        "leaderPhotoContainer"
    ).innerHTML =
        getPhotoHTML(
            leader,
            true
        );


    document.getElementById(
        "leaderName"
    ).textContent =
        "#" +
        leader.rank +
        " • " +
        leader.name;


    document.getElementById(
        "leaderZone"
    ).textContent =
        leader.zone ||
        "";


    document.getElementById(
        "leaderCollection"
    ).textContent =
        formatLakhs(
            leader.collection
        );


    document.getElementById(
        "leaderStatus"
    ).textContent =
        leader.eligible
            ? "🟢 ₹2L+ ELIGIBLE"
            : "🔒 ₹2L REQUIRED";

}


/* ==================================================
   ZONE FILTERS
================================================== */

function buildZoneButtons() {

    const container =
        document.getElementById(
            "zoneButtons"
        );


    const zones = [
        ...new Set(
            allData
                .map(
                    person =>
                        person.zone
                )
                .filter(Boolean)
        )
    ].sort();


    container.innerHTML = "";


    const allButton =
        document.createElement(
            "button"
        );


    allButton.className =
        "zone-btn " +
        (
            selectedZone === "ALL"
                ? "active"
                : ""
        );


    allButton.textContent =
        "ALL INDIA";


    allButton.onclick =
        function() {

            selectedZone =
                "ALL";

            buildZoneButtons();

            renderLeaderboard();

        };


    container.appendChild(
        allButton
    );


    zones.forEach(
        zone => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "zone-btn " +
                (
                    selectedZone === zone
                        ? "active"
                        : ""
                );


            button.textContent =
                zone;


            button.onclick =
                function() {

                    selectedZone =
                        zone;

                    buildZoneButtons();

                    renderLeaderboard();

                };


            container.appendChild(
                button
            );

        }
    );

}


/* ==================================================
   RENDER LEADERBOARD
================================================== */

function renderLeaderboard() {

    const container =
        document.getElementById(
            "leaderboard"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    let filtered =
        allData.filter(
            person => {

                const zoneMatch =
                    selectedZone ===
                    "ALL" ||
                    person.zone ===
                    selectedZone;


                const searchMatch =
                    !search ||
                    String(
                        person.name
                    )
                    .toLowerCase()
                    .includes(
                        search
                    );


                return (
                    zoneMatch &&
                    searchMatch
                );

            }
        );


    if (!filtered.length) {

        container.innerHTML = `

            <div class="message">
                No salesperson found.
            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered
            .map(
                person =>
                    createPlayerRow(
                        person
                    )
            )
            .join("");

}


/* ==================================================
   PLAYER ROW
================================================== */

function createPlayerRow(
    person
) {

    let rankClass = "";

    if (
        Number(person.rank) === 1
    ) {

        rankClass =
            "top1";

    } else if (
        Number(person.rank) === 2
    ) {

        rankClass =
            "top2";

    } else if (
        Number(person.rank) === 3
    ) {

        rankClass =
            "top3";

    }


    const collection =
        Number(
            person.collection
        ) || 0;


    const amountNeeded =
        Number(
            person.amountToEligibility
        ) || 0;


    let eligibilityText = "";


    if (
        person.eligible
    ) {

        eligibilityText =
            `<span class="eligibility eligible">
                ✓ ₹2L+ Eligible
             </span>`;

    } else {

        eligibilityText =
            `<span class="eligibility not-eligible">
                ₹${formatNumber(
                    amountNeeded
                )} more to unlock
             </span>`;

    }


    return `

        <div class="player-row">

            <div
                class="rank ${rankClass}"
            >
                ${person.rank}
            </div>


            <div class="player">

                ${getPhotoHTML(
                    person
                )}

                <div class="player-info">

                    <div class="player-name">
                        ${escapeHTML(
                            person.name
                        )}
                    </div>

                    <div class="player-zone">
                        ${escapeHTML(
                            person.zone ||
                            ""
                        )}
                    </div>

                </div>

            </div>


            <div class="desktop-zone">
                ${escapeHTML(
                    person.zone ||
                    "-"
                )}
            </div>


            <div>

                <div class="collection">
                    ${formatLakhs(
                        collection
                    )}
                </div>

                <div class="mobile-zone">
                    ${eligibilityText}
                </div>

            </div>


            <div class="row-reward">

                ${getRewardBadge(
                    person
                )}

            </div>

        </div>

    `;

}


/* ==================================================
   NUMBER FORMAT
================================================== */

function formatNumber(
    value
) {

    return new Intl.NumberFormat(
        "en-IN"
    ).format(
        Number(value) || 0
    );

}


/* ==================================================
   SEARCH
================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        renderLeaderboard();

    }
);


/* ==================================================
   INITIAL LOAD
================================================== */

loadData();


/* ==================================================
   AUTO REFRESH
================================================== */

setInterval(
    loadData,
    15000
);

</script>
